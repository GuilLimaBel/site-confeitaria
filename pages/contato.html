<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fazer Pedido | Confeitaria Sempre Doce</title>

    <link rel="stylesheet" href="../css/index.css">
    <link rel="stylesheet" href="../css/contato.css">

    <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Slabo+13px&display=swap" rel="stylesheet">
</head>

<body>

    <!-- CABEÇALHO -->
    <header>
        <div class="div-logo">
            <img class="logotipo"
                 src="../img/logo_confeitaria_sempre_doce.png"
                 alt="Logo da Confeitaria Sempre Doce">
        </div>

        <div class="div-menu">
            <h1>Confeitaria Sempre Doce</h1>

            <nav>
                <ul>
                    <li><a href="../index.html">Início</a></li>
                    <li><a href="../pages/sobre.html">Sobre</a></li>
                    <li><a href="../pages/cardapio.html">Cardápio</a></li>
                    <li><a href="../pages/contato.html">Pedidos</a></li>
                </ul>
            </nav>
        </div>

        <div class="div-logo"></div>
    </header>

    <!-- TÍTULO -->
    <main class="pagina-pedido">

        <h2>Faça seu Pedido</h2>

        <p class="descricao">
            Preencha seus dados, escolha seus produtos e finalize seu pedido!
        </p>

        <form id="form-pedido">

            <!-- DADOS DO CLIENTE -->
            <fieldset>
                <legend>Dados do Cliente</legend>

                <div class="campo">
                    <label for="nome">Nome completo:</label>
                    <input type="text" id="nome" name="nome"
                           placeholder="Digite seu nome" required>
                </div>

                <div class="campo">
                    <label for="telefone">Telefone:</label>
                    <input type="tel" id="telefone" name="telefone"
                           placeholder="(00) 00000-0000" required>
                </div>

                <div class="campo">
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email"
                           placeholder="seuemail@email.com">
                </div>

                <div class="campo">
                    <label for="cep">CEP:</label>
                    <input type="text" id="cep" name="cep"
                           placeholder="Digite seu CEP" required>
                </div>

                <div class="campo">
                    <label for="endereco">Endereço:</label>
                    <input type="text" id="endereco" name="endereco"
                           placeholder="Rua, avenida..." required>
                </div>

                <div class="campo">
                    <label for="numero">Número:</label>
                    <input type="text" id="numero" name="numero"
                           placeholder="Número da residência" required>
                </div>

                <div class="campo">
                    <label for="bairro">Bairro:</label>
                    <input type="text" id="bairro" name="bairro" required>
                </div>

                <div class="campo">
                    <label for="cidade">Cidade:</label>
                    <input type="text" id="cidade" name="cidade" required>
                </div>

                <div class="campo">
                    <label for="complemento">Complemento:</label>
                    <input type="text" id="complemento" name="complemento"
                           placeholder="Apartamento, casa...">
                </div>
            </fieldset>

            <!-- ITENS DO PEDIDO -->
            <fieldset>
                <legend>Itens do Pedido</legend>

                <div class="campo">
                    <label for="produto">Escolha o produto:</label>

                    <select id="produto" name="produto" required>
                        <option value="">Selecione um produto</option>
                        <option value="Bolo de Laranja" data-preco="35">Bolo de Laranja - R$ 35,00</option>
                        <option value="Bolo Mesclado" data-preco="40">Bolo Mesclado - R$ 40,00</option>
                        <option value="Bolo de Milho" data-preco="30">Bolo de Milho - R$ 30,00</option>
                        <option value="Bolo de Chocolate" data-preco="45">Bolo de Chocolate - R$ 45,00</option>
                        <option value="Bolo de Cenoura" data-preco="38">Bolo de Cenoura - R$ 38,00</option>
                        <option value="Bolo de Fubá" data-preco="28">Bolo de Fubá - R$ 28,00</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="quantidade">Quantidade:</label>
                    <input type="number" id="quantidade" name="quantidade"
                           min="1" value="1" required>
                </div>

                <div class="campo">
                    <label for="preco">Preço unitário:</label>
                    <input type="text" id="preco" value="R$ 0,00" readonly>
                </div>

                <div class="campo">
                    <label for="total">Total:</label>
                    <input type="text" id="total" value="R$ 0,00" readonly>
                </div>

                <div class="campo">
                    <label for="observacoes">Observações:</label>
                    <textarea id="observacoes" name="observacoes"
                              rows="4"
                              placeholder="Descreva detalhes do pedido"></textarea>
                </div>
            </fieldset>

            <!-- PAGAMENTO -->
            <fieldset>
                <legend>Forma de Pagamento</legend>

                <div class="campo">
                    <label for="pagamento">Método:</label>

                    <select id="pagamento" name="pagamento" required>
                        <option value="">Selecione o pagamento</option>
                        <option value="Pix">Pix</option>
                        <option value="Cartão de crédito">Cartão de crédito</option>
                        <option value="Cartão de débito">Cartão de débito</option>
                        <option value="Dinheiro">Dinheiro</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="entrega">Entrega:</label>

                    <select id="entrega" name="entrega" required>
                        <option value="">Selecione</option>
                        <option value="Entrega">Receber em casa</option>
                        <option value="Retirada">Retirar na confeitaria</option>
                    </select>
                </div>
            </fieldset>

            <!-- BOTÕES -->
            <div class="botoes">
                <button type="submit">Finalizar Pedido</button>
                <button type="reset">Limpar Formulário</button>
            </div>

        </form>
    </main>

    <!-- RODAPÉ -->
    <footer>
        <p>Confeitaria Sempre Doce - Feito com carinho!</p>
    </footer>

    <script src="../js/contato.js"></script>

</body>
</html>
